name: arrow_maze_escape_puzzle
description: Arrow Maze Escape Puzzle - Puzzle game built with Clean Architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  meta: ^1.11.0
  shared_preferences: ^2.3.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/background.mp3
    - assets/audio/times_up.mp3
    - assets/audio/no_movements_left.mp3
    - assets/audio/General_Tap/general_click_sound.mp3
    - assets/audio/Level_Cleared/level_cleared.mp3
    - assets/audio/Movement_Not_Allowe/not_allowed_movement.mp3
    - assets/audio/Tap_sound/tap_sound_1.mp3
    - assets/audio/Tap_sound/tap_sound_2.mp3
    - assets/audio/Tap_sound/tap_sound_3.mp3
    - assets/audio/Tap_sound/tap_sound_4.mp3
    - assets/audio/Tap_sound/tap_sound_5.mp3
